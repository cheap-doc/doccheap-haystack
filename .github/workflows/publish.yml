# Publishes the package to PyPI when a version tag is pushed.
#
# PyPI authentication is trusted publishing: the project's PyPI settings trust
# this repository, this workflow file and the `pypi` environment, and PyPI
# exchanges the job's OIDC token (`id-token: write`) for a short-lived upload
# credential. No API token is stored anywhere. The publish action also uploads
# a signed attestation of how the files were built.
#
# The tag is the bare version from pyproject.toml, for example 0.1.0.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      # Mints the token PyPI exchanges for the upload credential.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the tag matches the package version
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi

      - name: Install the package with its development tools
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: pytest --cov

      - name: Build the distributions
        run: |
          python -m pip install build
          python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
